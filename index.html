<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />


<!-- Viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Title -->
<title>Trends of Media – Digital Marketing Agency</title>

<!-- Basic SEO -->
<meta name="description" content="We are a global creative agency that combines design expertise with technology and intelligence to create award-winning digital products." />
<meta name="author" content="Trends of Media" />

<!-- Robots (ADDED) -->
<meta name="robots" content="index, follow" />

<!-- Canonical (FIXED to www) -->
<link rel="canonical" href="https://www.trendsofmedia.com/" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="/images/Medialogo.png" />

<!-- Open Graph -->
<meta property="og:title" content="Trends of Media | No.1 Digital Marketing Agency in Mumbai" />
<meta property="og:description" content="Trends of Media is a full-service digital marketing agency based in India specializing in SEO, social media marketing, and branding solutions." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://www.trendsofmedia.com/" />
<meta property="og:image" content="https://www.trendsofmedia.com/images/Medialogo.png" />

<!-- Twitter SEO -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Trends of Media | No.1 Digital Marketing Agency in Mumbai" />
<meta name="twitter:description" content="Trends of Media | No.1 Digital Marketing Agency in Mumbai providing SEO, social media, Google Ads & branding solutions for business growth." />
<meta name="twitter:image" content="https://www.trendsofmedia.com/images/Medialogo.png" />

<!-- Performance: Preconnect -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" />

<!-- Theme Color (ADDED for mobile UI) -->
<meta name="theme-color" content="#000000" />

<!-- Schema Markup -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "name": "Trends Of Media Performance-Driven Digital Marketing Agency",

    "logo": "https://www.trendsofmedia.com/images/Medialogo.png",
    "description": "Top digital marketing agency in India providing SEO, social media marketing, PPC advertising, branding and web development.",
    "sameAs": [
      "https://www.instagram.com/trendsofmediaofficial/?utm_source=ig_web_button_share_sheet",
      "https://www.facebook.com/",
      "https://www.linkedin.com/company/trends-of-media/"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "IN"
    }
  }
</script>


  </head>
